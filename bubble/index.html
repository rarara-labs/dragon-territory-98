(()=>{'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),W=800,H=560,$=id=>document.getElementById(id);const keys={left:false,right:false,up:false,down:false,jump:false,fire:false};let mode='TITLE',stage=1,score=0,lives=3,high=0,elapsed=0,clock=0,shake=0,fireCD=0,jumpHeld=false,menuSound=true,audio=null,musicTimer=0,musicStep=0,stageTimer=0;let platforms=[],player,enemies=[],bubbles=[],particles=[],gems=[],stars=[],decor=[];let pointers=new Map();const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function beep(freq=400,dur=.1,kind='sine',gain=.04,slide=0){if(!menuSound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime;o.type=kind;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),t+dur);a.gain.setValueAtTime(gain,t);a.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(a).connect(audio.destination);o.start(t);o.stop(t+dur+.01)}catch(e){}}
function music(on){clearInterval(musicTimer);musicTimer=0;if(!on||!menuSound)return;let notes=[392,494,587,784,659,587,494,440,392,523,659,880,784,659,523,440];musicStep=0;musicTimer=setInterval(()=>{if(mode!=='PLAY')return;let n=notes[musicStep++%notes.length];beep(n,.13,'triangle',.013);if(musicStep%4===1)beep(n/2,.23,'sine',.01)},185)}

function build(){elapsed=0;fireCD=0;stageTimer=0;let variant=(stage-1)%5;platforms=[{x:0,y:521,w:800,h:39},{x:50,y:417,w:235,h:18},{x:500,y:417,w:250,h:18},{x:275,y:316,w:260,h:18},{x:55,y:215,w:225,h:18},{x:515,y:215,w:225,h:18}];if(variant===1){platforms[3]={x:285,y:335,w:230,h:18};platforms[4]={x:75,y:245,w:205,h:18};platforms[5]={x:520,y:245,w:200,h:18}}if(variant===2){platforms.push({x:327,y:128,w:145,h:18})}if(variant===3){platforms[1].x=10;platforms[2].x=560;platforms[3].x=260;platforms.push({x:90,y:115,w:150,h:18})}if(variant===4){platforms.push({x:295,y:126,w:210,h:18});platforms[3]={x:245,y:327,w:310,h:18}}

function show(title,desc,action,cb){mode=title==='PAUSED'?'PAUSED':mode;$('modal').innerHTML=`<div class="spark">🫧 ✨ 🫧</div><h1>${title}</h1><p class="sub">${desc}</p><button id="modalAction">${action}</button><br><a class="btn secondary" href="../">⌂ ARCADE MENU</a>`;$('overlay').classList.remove('hide');$('modalAction').addEventListener('click',cb)}

function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(45,200);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.85),max:.85,color,r:rand(2,6)})}}

function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function physics(obj,dt){let oldBottom=obj.y+obj.h;obj.x+=obj.vx*dt;obj.x=clamp(obj.x,0,W-obj.w);obj.y+=obj.vy*dt;obj.on=false;if(obj.vy>=0){for(let p of platforms){if(obj.x+obj.w>p.x+5&&obj.x<p.x+p.w-5&&oldBottom<=p.y+9&&obj.y+obj.h>=p.y){obj.y=p.y-obj.h;obj.vy=0;obj.on=true;break}}}if(obj.y+obj.h>H){obj.y=H-obj.h;obj.vy=0;obj.on=true}}
function update(dt){clock+=dt;shake=Math.max(0,shake-dt);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(mode==='CLEAR'){stageTimer-=dt;if(stageTimer<=0)nextStage();return}if(mode!=='PLAY')return;elapsed+=dt;fireCD=Math.max(0,fireCD-dt);player.inv=Math.max(0,player.inv-dt);player.fireAnim=Math.max(0,player.fireAnim-dt);let dx=(keys.right?1:0)-(keys.left?1:0);player.vx=dx*230;if(dx)player.face=dx;if((keys.jump||keys.up)&&!jumpHeld&&player.on){player.vy=-440;player.on=false;beep(470,.13,'triangle',.035,260)}jumpHeld=keys.jump||keys.up;player.vy+=1050*dt;physics(player,dt);if(keys.fire)shoot();
for(let e of enemies){if(!e.alive||e.trapped)continue;e.wiggle+=dt;e.jumpWait-=dt;e.vy+=1050*dt;if(e.on&&e.jumpWait<=0){e.vy=-rand(290,380);e.jumpWait=rand(1.3,3.1)/(1+stage*.03)}let speed=55+stage*8+(e.boss?40:0);e.vx=Math.sign(e.vx||1)*speed;if(e.x<14||e.x+e.w>W-14)e.vx*=-1;if(e.on){let edge=e.vx>0?e.x+e.w+12:e.x-12;let safe=platforms.some(p=>Math.abs(p.y-(e.y+e.h))<6&&edge>p.x&&edge<p.x+p.w);if(!safe)e.vx*=-1}physics(e,dt);if(collide(player,e))damage()}
for(let b of bubbles){b.age+=dt;b.life-=dt;b.phase+=dt*3;if(b.trap){let e=b.trap;b.vx=Math.sin(b.age*3)*24;b.vy=-57;b.x+=b.vx*dt;b.y+=b.vy*dt;e.x=b.x-e.w/2;e.y=b.y-e.h/2;e.trapTime-=dt;if(e.trapTime<=0){e.trapped=false;e.x=clamp(e.x,0,W-e.w);e.y=clamp(e.y,0,H-e.h);e.vy=0;b.life=0}continue}b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.96,dt*60);b.vy-=13*dt;if(b.x<20||b.x>W-20)b.vx*=-.65;for(let e of enemies){if(!e.alive||e.trapped)continue;let cx=e.x+e.w/2,cy=e.y+e.h/2;if(Math.hypot(b.x-cx,b.y-cy)<b.r+e.w*.35){b.trap=e;e.trapped=true;e.trapTime=e.boss?2.5:5;b.life=6;b.r=e.boss?35:24;b.vx=0;b.vy=-55;beep(950,.14,'sine',.045,-400);burst(b.x,b.y,'#b6f9ff',8);break}}}
for(let b of bubbles){if(!b.trap||b.life<=0)continue;let dist=Math.hypot(player.x+15-b.x,player.y+18-b.y);if(dist<b.r+22){let e=b.trap;b.life=0;e.trapped=false;if(e.boss&&e.hp>1){e.hp--;e.inv=.5;score+=300;burst(b.x,b.y,'#ffabef',25)}else{e.alive=false;score+=e.boss?2000:250;gems.push({x:b.x,y:b.y,vy:-95,life:5});burst(b.x,b.y,'#ffe9a5',24)}beep(1170,.16,'triangle',.06,-700);navigator.vibrate?.(24)}}
bubbles=bubbles.filter(b=>b.life>0&&b.y>-50);for(let gem of gems){gem.vy+=260*dt;gem.y+=gem.vy*dt;gem.life-=dt;if(Math.hypot(gem.x-player.x-15,gem.y-player.y-15)<33){gem.life=0;score+=100;beep(1250,.08,'sine',.04)}}gems=gems.filter(g=>g.life>0);if(enemies.every(e=>!e.alive))clearStage();hud()}
function roundRect(x,y,w,h,r,fill){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill()}
function bg(){let grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#28216a');grd.addColorStop(.58,'#1b205c');grd.addColorStop(1,'#0b234c');g.fillStyle=grd;g.fillRect(0,0,W,H);for(let s of stars){g.globalAlpha=.3+.5*(.5+.5*Math.sin(clock*2+s.phase));g.fillStyle='#f6e8ff';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}g.globalAlpha=1;for(let d of decor){let y=(d.y-clock*8+d.phase*20+H)%H;g.strokeStyle='#9bd8ff22';g.lineWidth=2;g.beginPath();g.arc(d.x,y,d.r,0,7);g.stroke()}for(let i=0;i<6;i++){let x=i*150-50,y=H-90+(i%2)*20;g.fillStyle='#2a3e79';g.beginPath();g.arc(x,y,115,Math.PI,0);g.fill()}g.fillStyle='#2c347b';g.fillRect(0,H-38,W,38)}

function bubble(b){let r=b.r;g.save();g.translate(b.x,b.y);let glow=g.createRadialGradient(-r*.3,-r*.4,r*.12,0,0,r);glow.addColorStop(0,'#ffffffd9');glow.addColorStop(.28,'#9bf6ff55');glow.addColorStop(.66,'#7bc8ff2b');glow.addColorStop(1,'#f7aaff8a');g.shadowColor='#91ecff';g.shadowBlur=16;g.fillStyle=glow;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.shadowBlur=0;g.strokeStyle='#dbfbffb8';g.lineWidth=2;g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.lineCap='round';g.beginPath();g.arc(-r*.2,-r*.2,r*.62,3.45,4.8);g.stroke();g.fillStyle='#fff9';g.beginPath();g.arc(r*.43,r*.38,2.2,0,7);g.fill();if(b.trap){g.save();g.scale(.7,.7);monster({...b.trap,x:-b.trap.w/2,y:-b.trap.h/2});g.restore()}g.restore()}
function draw(){g.save();if(shake>0)g.translate(rand(-4,4),rand(-4,4));bg();for(let p of platforms)platform(p);for(let gem of gems){g.fillStyle='#ffe98d';g.shadowColor='#ffe98d';g.shadowBlur=12;g.beginPath();g.moveTo(gem.x,gem.y-9);g.lineTo(gem.x+8,gem.y);g.lineTo(gem.x,gem.y+9);g.lineTo(gem.x-8,gem.y);g.fill();g.shadowBlur=0}for(let e of enemies)if(e.alive&&!e.trapped)monster(e);for(let b of bubbles)bubble(b);if(player)hero(player);for(let p of particles){g.globalAlpha=clamp(p.life/p.max,0,1);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}g.globalAlpha=1;if(mode==='CLEAR'){g.fillStyle='#151047b9';g.fillRect(0,0,W,H);g.textAlign='center';g.shadowColor='#ffb9ed';g.shadowBlur=20;g.font='900 57px system-ui';g.fillStyle='#fff';g.fillText('STAGE CLEAR!',W/2,260);g.shadowBlur=0;g.font='bold 24px system-ui';g.fillStyle='#ffe88b';g.fillText('✨ NEXT STAGE ✨',W/2,305)}if(mode==='PLAY'&&stage%5===0){g.textAlign='center';g.font='bold 20px system-ui';g.fillStyle='#ffe28e';g.fillText('★ BOSS STAGE ★',W/2,35)}g.restore()}

const keyMap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',' ':'jump',z:'fire',Z:'fire',j:'fire',J:'fire'};addEventListener('keydown',e=>{let k=keyMap[e.key];if(k){keys[k]=true;e.preventDefault()}if(e.key==='Escape'||e.key==='p'||e.key==='P')pause()},{passive:false});addEventListener('keyup',e=>{let k=keyMap[e.key];if(k){keys[k]=false;e.preventDefault()}},{passive:false});function releaseAll(){Object.keys(keys).forEach(k=>keys[k]=false);document.querySelectorAll('.pressed').forEach(el=>el.classList.remove('pressed'));pointers.clear();jumpHeld=false}addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAll();if(mode==='PLAY')pause()}});
