</style></head><body><div id="app"><div id="hud"><span id="score">SCORE 000000</span><span id="stage">STAGE 1</span><span id="life">LIFE ♥♥♥</span><span id="hi">HI 000000</span></div><div id="box"><canvas id="c" width="800" height="520"></canvas><div id="overlay"><div class="panel"><h1>RACCOON<br>TREASURE '90</h1><p>보물을 모두 모아 출구를 여세요!<br>사다리와 발판을 이용하고 몬스터를 피하세요.<br><b>PC</b> 방향키/WASD · SPACE 점프<br><b>MOBILE</b> 방향키 · JUMP</p><button id="start">START</button><button id="sound">SOUND ON</button><br><a class="back" href="../">ARCADE MENU</a></div></div></div><div id="controls"><div class="dpad"><div class="ctrl up" data-k="up">▲</div><div class="ctrl left" data-k="left">◀</div><div class="ctrl down" data-k="down">▼</div><div class="ctrl right" data-k="right">▶</div></div><div class="tip">MOVE · LADDER · SPACE JUMP</div><div class="jump" data-k="jump">JUMP</div></div></div>
<script>
const C=document.querySelector("#c"),X=C.getContext("2d"),$=s=>document.querySelector(s),W=800,H=520;let state="TITLE",stage=1,score=0,lives=3,hi=+(localStorage.rtRaccoonHi||0),soundOn=true,audio,bgm,last=0,jumpLock=0;const K={left:0,right:0,up:0,down:0,jump:0},P={x:55,y:438,vx:0,vy:0,w:24,h:30,on:0,inv:0};let plats=[],ladders=[],items=[],enemies=[],exit={x:730,y:55,w:30,h:42,open:0};
function tone(f=440,d=.08,type="square",v=.04){if(!soundOn)return;try{audio??=new(AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function music(on){clearInterval(bgm);if(!on||!soundOn)return;let q=[262,330,392,523,392,330,294,349,440,587,440,349],i=0;bgm=setInterval(()=>tone(q[i++%q.length],.09,"square",.018),140)}
const hitbox=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function build(){P.x=55;P.y=438;P.vx=P.vy=0;P.inv=1200;plats=[{x:0,y:480,w:800,h:40},{x:35,y:390,w:270,h:18},{x:405,y:390,w:350,h:18},{x:130,y:300,w:310,h:18},{x:525,y:300,w:240,h:18},{x:30,y:210,w:260,h:18},{x:385,y:210,w:345,h:18},{x:110,y:120,w:300,h:18},{x:510,y:120,w:250,h:18}];ladders=[{x:220,y:300,w:28,h:90},{x:585,y:300,w:28,h:90},{x:165,y:210,w:28,h:90},{x:650,y:120,w:28,h:90},{x:335,y:120,w:28,h:90}];let s=[[85,355],[260,355],[450,355],[690,355],[175,265],[390,265],[575,265],[90,175],[245,175],[450,175],[680,175],[155,85],[370,85],[560,85],[710,85]];items=s.slice(0,Math.min(15,8+stage)).map((a,i)=>({x:a[0],y:a[1],w:18,h:18,t:i%3}));enemies=[];for(let i=0;i<Math.min(7,2+stage);i++){let p=plats[1+i%(plats.length-1)];enemies.push({x:p.x+45+(i*67)%Math.max(70,p.w-80),y:p.y-24,w:24,h:24,v:(i%2?1:-1)*(72+stage*9),min:p.x,max:p.x+p.w})}exit.open=0}
function hud(){hi=Math.max(hi,score);localStorage.rtRaccoonHi=hi;$("#score").textContent="SCORE "+String(score).padStart(6,"0");$("#stage").textContent="STAGE "+stage;$("#life").textContent="LIFE "+"♥".repeat(Math.max(0,lives));$("#hi").textContent="HI "+String(hi).padStart(6,"0")}
function start(){stage=1;score=0;lives=3;state="PLAY";$("#overlay").style.display="none";build();music(1);tone(660,.12);hud()}
function hurt(){if(P.inv)return;lives--;tone(100,.3,"sawtooth",.06);navigator.vibrate?.([60,40,90]);hud();if(lives<=0)return over();P.x=55;P.y=438;P.vx=P.vy=0;P.inv=1700}
function over(){state="OVER";music(0);$("#overlay").innerHTML='<div class="panel"><h1>GAME OVER</h1><p>SCORE '+score+' · STAGE '+stage+'</p><button id="retry">RETRY</button><a class="back" href="../">ARCADE MENU</a></div>';$("#overlay").style.display="grid";$("#retry").addEventListener("pointerup",e=>{e.preventDefault();start()},{once:true})}
function clearStage(){state="CLEAR";tone(880,.25);music(0);setTimeout(()=>{stage++;build();state="PLAY";music(1);hud()},850)}
function update(ms){if(state!=="PLAY")return;let d=ms/1000;P.inv=Math.max(0,P.inv-ms);let ladder=ladders.some(l=>hitbox(P,l));P.vx=(K.left?-155:0)+(K.right?155:0);if(ladder&&(K.up||K.down)){P.vy=K.up?-130:130;P.on=0}else P.vy+=900*d;if(K.jump&&!jumpLock&&(P.on||ladder)){P.vy=-350;jumpLock=1;tone(520,.06)}if(!K.jump)jumpLock=0;let oy=P.y;P.x=Math.max(0,Math.min(W-P.w,P.x+P.vx*d));P.y+=P.vy*d;P.on=0;if(P.vy>=0)for(let p of plats)if(P.x+P.w>p.x&&P.x<p.x+p.w&&oy+P.h<=p.y+6&&P.y+P.h>=p.y){P.y=p.y-P.h;P.vy=0;P.on=1;break}if(P.y>H+30)hurt();for(let e of enemies){e.x+=e.v*d;if(e.x<e.min||e.x+e.w>e.max){e.v*=-1;e.x=Math.max(e.min,Math.min(e.max-e.w,e.x))}if(hitbox(P,e))hurt()}for(let i=items.length-1;i>=0;i--)if(hitbox(P,items[i])){let q=items.splice(i,1)[0];score+=q.t===2?300:100;tone(q.t===2?920:720,.07);navigator.vibrate?.(20)}exit.open=items.length===0;if(exit.open&&hitbox(P,exit))clearStage();hud()}
function raccoon(x,y){X.save();X.translate(x+12,y+15);X.fillStyle="#8a6547";X.fillRect(-8,-5,17,17);X.fillStyle="#d8b28a";X.fillRect(-7,-14,15,12);X.fillStyle="#4b3a34";X.fillRect(-9,-11,5,6);X.fillRect(5,-11,5,6);X.fillRect(-6,-8,5,4);X.fillRect(2,-8,5,4);X.fillStyle="#fff";X.fillRect(-4,-7,2,2);X.fillRect(4,-7,2,2);X.fillStyle="#222";X.fillRect(-1,-3,3,3);X.fillStyle="#76533e";X.fillRect(8,5,11,7);X.fillStyle="#2b2526";X.fillRect(12,5,4,7);X.restore()}
function draw(){X.fillStyle="#061026";X.fillRect(0,0,W,H);X.fillStyle="#ffffff08";for(let y=0;y<H;y+=4)X.fillRect(0,y,W,1);for(let p of plats){X.fillStyle="#914721";X.fillRect(p.x,p.y,p.w,p.h);X.fillStyle="#e6a04b";X.fillRect(p.x,p.y,p.w,5)}X.strokeStyle="#f3c36b";X.lineWidth=5;for(let l of ladders){X.strokeRect(l.x,l.y,l.w,l.h);for(let y=l.y+12;y<l.y+l.h;y+=14){X.beginPath();X.moveTo(l.x,y);X.lineTo(l.x+l.w,y);X.stroke()}}items.forEach(q=>{X.fillStyle=q.t===0?"#ff5b5b":q.t===1?"#67e86e":"#ffe14d";X.fillRect(q.x,q.y,q.w,q.h);X.fillStyle="#fff";X.fillRect(q.x+5,q.y+4,5,5)});enemies.forEach((e,i)=>{X.fillStyle=i%2?"#79aaff":"#f66";X.fillRect(e.x,e.y,e.w,e.h);X.fillStyle="#fff";X.fillRect(e.x+4,e.y+5,5,5);X.fillRect(e.x+15,e.y+5,5,5)});X.fillStyle=exit.open?"#67ff8d":"#555";X.fillRect(exit.x,exit.y,exit.w,exit.h);X.fillStyle="#111";X.fillRect(exit.x+7,exit.y+9,16,33);if(!P.inv||Math.floor(P.inv/90)%2===0)raccoon(P.x,P.y);if(state==="CLEAR"){X.fillStyle="#000a";X.fillRect(0,0,W,H);X.fillStyle="#ffe65a";X.font="bold 46px monospace";X.textAlign="center";X.fillText("STAGE CLEAR!",W/2,H/2)}}
function loop(t){let dt=Math.min(32,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
let map={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down"," ":"jump"};addEventListener("keydown",e=>{if(map[e.key]){K[map[e.key]]=1;e.preventDefault()}});addEventListener("keyup",e=>{if(map[e.key]){K[map[e.key]]=0;e.preventDefault()}});document.querySelectorAll("[data-k]").forEach(el=>{let k=el.dataset.k;el.addEventListener("pointerdown",e=>{e.preventDefault();K[k]=1;try{el.setPointerCapture(e.pointerId)}catch(_){}});["pointerup","pointercancel"].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();K[k]=0}))});addEventListener("pointerup",()=>Object.keys(K).forEach(k=>K[k]=0));$("#start").addEventListener("pointerup",e=>{e.preventDefault();start()});$("#sound").addEventListener("pointerup",e=>{e.preventDefault();soundOn=!soundOn;e.currentTarget.textContent=soundOn?"SOUND ON":"SOUND OFF";music(state==="PLAY"&&soundOn)});["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));document.addEventListener("contextmenu",e=>e.preventDefault());
